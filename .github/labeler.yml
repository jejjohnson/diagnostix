# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `uv run poe gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

# One area per public module; the private code lives in src/diagnostix/_src/<module>/.
"area:kinematics":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/kinematics.py"
      - "src/diagnostix/_src/kinematics/**"

"area:columns":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/columns.py"
      - "src/diagnostix/_src/columns/**"

"area:budgets":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/budgets.py"
      - "src/diagnostix/_src/budgets/**"

"area:climate":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/climate.py"
      - "src/diagnostix/_src/climate/**"

"area:spectra":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/spectra.py"
      - "src/diagnostix/_src/spectra/**"

"area:eofs":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/eofs.py"
      - "src/diagnostix/_src/eofs/**"

"area:skill":
  - changed-files:
    - any-glob-to-any-file:
      - "src/diagnostix/skill.py"
      - "src/diagnostix/_src/skill/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
